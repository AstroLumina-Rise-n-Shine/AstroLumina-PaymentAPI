services:
  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/astrolumina-rise-n-shine/astrolumina-paymentapi:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - PAYMENT_API_SERVER_PORT=${PAYMENT_API_SERVER_PORT}
      - PAYMENT_API_SENTRY_DSN=${PAYMENT_API_SENTRY_DSN}
      - STRIPE_API_VER=${STRIPE_API_VER}
      - STRIPE_SK=${STRIPE_SK}
      - STRIPE_SOARELE_STRALUCIREA_TA=${STRIPE_SOARELE_STRALUCIREA_TA}
      - STRIPE_GHID_SATURN_IN_BERBEC=${STRIPE_GHID_SATURN_IN_BERBEC}
      - STRIPE_ASTROGRAMA_NATALA_SI_KARMICA=${STRIPE_ASTROGRAMA_NATALA_SI_KARMICA}
      - STRIPE_ASTROGRAMA_RELATIONALA=${STRIPE_ASTROGRAMA_RELATIONALA}
      - STRIPE_ASTROGRAMA_PREVIZIONALA=${STRIPE_ASTROGRAMA_PREVIZIONALA}
      - STRIPE_EVENIMENT_CONSTELATII=${STRIPE_EVENIMENT_CONSTELATII}
      - ASTROLOGY_API_SERVER_DC_PORT=${ASTROLOGY_API_SERVER_DC_PORT}
      - ASTROLOGY_API_SERVER_DC_DNS=${ASTROLOGY_API_SERVER_DC_DNS}
      - ASTROLOGY_API_SERVER_K8S_PORT=${ASTROLOGY_API_SERVER_K8S_PORT}
      - ASTROLOGY_API_SERVER_K8S_DNS=${ASTROLOGY_API_SERVER_K8S_DNS}
      - BOOKING_API_SERVER_DC_PORT=${BOOKING_API_SERVER_DC_PORT}
      - BOOKING_API_SERVER_DC_DNS=${BOOKING_API_SERVER_DC_DNS}
      - BOOKING_API_SERVER_K8S_PORT=${BOOKING_API_SERVER_K8S_PORT}
      - BOOKING_API_SERVER_K8S_DNS=${BOOKING_API_SERVER_K8S_DNS}
      - PAYMENT_API_SERVER_DC_PORT=${PAYMENT_API_SERVER_DC_PORT}
      - PAYMENT_API_SERVER_DC_DNS=${PAYMENT_API_SERVER_DC_DNS}
      - PAYMENT_API_SERVER_K8S_PORT=${PAYMENT_API_SERVER_K8S_PORT}
      - PAYMENT_API_SERVER_K8S_DNS=${PAYMENT_API_SERVER_K8S_DNS}
      - FRONTEND_SERVER_DC_PORT=${FRONTEND_SERVER_DC_PORT}
      - FRONTEND_SERVER_DC_DNS=${FRONTEND_SERVER_DC_DNS}
      - FRONTEND_SERVER_K8S_PORT=${FRONTEND_SERVER_K8S_PORT}
      - FRONTEND_SERVER_K8S_DNS=${FRONTEND_SERVER_K8S_DNS}
    ports:
      - "${PAYMENT_API_SERVER_DC_PORT}:${PAYMENT_API_SERVER_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${PAYMENT_API_SERVER_PORT}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.125"
          memory: 128M
    networks:
      - payment-api

networks:
  payment-api:
    name: payment-api-network
    driver: bridge
